<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spline Robot</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: transparent;
        }
        spline-viewer {
            width: 100%;
            height: 100%;
        }
    </style>
</head>
<body>
    <!-- 
      This is loaded inside an iframe to completely isolate the Spline WebGL engine 
      from Next.js 16/React 19 devtools. This prevents any internal engine "Missing property" 
      errors from triggering the Next.js Error Overlay.
    -->
    <script type="module" src="https://unpkg.com/@splinetool/viewer@1.9.59/build/spline-viewer.js"></script>
    <spline-viewer url="https://prod.spline.design/y1AAiIZqwQofQ3rh/scene.splinecode"></spline-viewer>
    <script>
        const cloakWatermark = () => {
            const viewer = document.querySelector('spline-viewer');
            if (viewer && viewer.shadowRoot) {
                const styleId = 'anti-watermark-css';
                if (!viewer.shadowRoot.getElementById(styleId)) {
                    const style = document.createElement('style');
                    style.id = styleId;
                    style.textContent = `
                        #logo, a[href*="spline.design"], .spline-watermark {
                            display: none !important;
                            opacity: 0 !important;
                            visibility: hidden !important;
                            pointer-events: none !important;
                        }
                    `;
                    viewer.shadowRoot.appendChild(style);
                }
            }
        };
        // Run every 500ms instead of every frame to save CPU
        setInterval(cloakWatermark, 500);
    </script>
</body>
</html>
